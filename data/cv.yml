interests: >-
  Psychometrics and educational measurement; Bayesian latent variable modeling;
  item response theory (IRT) and Many-Facet Rasch models; growth mixture models
  and model selection; automated scoring and AI/LLM evaluation; measurement
  invariance and cross-cultural assessment; integration of machine learning with
  human judgment systems.

