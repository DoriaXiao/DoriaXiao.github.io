# Single source for publications.
# Used by publications.qmd (website) and cv/cv.typ (PDF CV).
# Order within each type is the display order (newest first).
#
# Fields
#   type:       preprint | journal | chapter | review
#   authors:    APA-style names; "Xiao, X." is bolded automatically.
#               Use "…" for omitted authors.
#   year:       text shown in parentheses, e.g. 2026, "2026, June 7", "submitted"
#   title:      italic for preprints, plain otherwise
#   venue:      italic (journal, book, or series); plain for preprints
#   venue_pre:  text before the venue, e.g. "In X. Liu & W. J. Boone (Eds.),"
#   venue_post: text after the venue, e.g. "(Special Issue: ...)"
#   volume, issue, pages
#   note:       e.g. "Advance online publication."
#   doi:        bare DOI, e.g. 10.1017/psy.2025.11
#   url:        used when there is no DOI
#   links:      extra links, list of {text, url}

